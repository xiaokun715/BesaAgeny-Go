          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U besa -d besa_agent; do echo waiting postgres; sleep 2; done"]
        - name: wait-nats
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until wget -q -O- http://nats:8222/healthz >/dev/null 2>&1; do echo waiting nats; sleep 2; done"]
      containers:
        - name: besa
          image: besa-agent:v4
          imagePullPolicy: IfNotPresent
