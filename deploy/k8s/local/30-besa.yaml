# BesaAgent 本地 Kubernetes 部署（Docker Desktop Kubernetes）
#
# 前置：
#   1. 构建镜像：见 deploy/README-local.md
#   2. Postgres/Redis/NATS 已由同目录清单部署
# 访问控制面：kubectl -n besa-local port-forward svc/besa-control 8080:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: besa-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: besa-gateway}
  template:
    metadata:
      labels: {app: besa-gateway}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U besa -d besa_agent; do echo waiting postgres; sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until redis-cli -h redis ping | grep -q PONG; do echo waiting redis; sleep 2; done"]
      containers:
        - name: besa
          image: besa-agent:v4
          imagePullPolicy: IfNotPresent
          args: ["--env", "prod", "serve", "--role", "gateway"]
          ports: [{name: grpc, containerPort: 9001}]
          envFrom:
            - configMapRef: {name: besa-config}
            - secretRef: {name: besa-secrets}
          readinessProbe: {tcpSocket: {port: 9001}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 30}
          livenessProbe: {tcpSocket: {port: 9001}, initialDelaySeconds: 60, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: besa-gateway
spec:
  selector: {app: besa-gateway}
  ports: [{name: grpc, port: 9001, targetPort: 9001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: besa-tool
spec:
  replicas: 1
  selector:
    matchLabels: {app: besa-tool}
  template:
    metadata:
      labels: {app: besa-tool}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U besa -d besa_agent; do echo waiting postgres; sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until redis-cli -h redis ping | grep -q PONG; do echo waiting redis; sleep 2; done"]
      containers:
        - name: besa
          image: besa-agent:v4
          imagePullPolicy: IfNotPresent
          args: ["--env", "prod", "serve", "--role", "tool"]
          ports: [{name: grpc, containerPort: 9002}]
          envFrom:
            - configMapRef: {name: besa-config}
            - secretRef: {name: besa-secrets}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          readinessProbe: {tcpSocket: {port: 9002}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 30}
          livenessProbe: {tcpSocket: {port: 9002}, initialDelaySeconds: 60, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
