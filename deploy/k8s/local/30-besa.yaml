---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: besa-control
spec:
  replicas: 1
  selector:
    matchLabels: {app: besa-control}
  template:
    metadata:
      labels: {app: besa-control}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U besa -d besa_agent; do echo waiting postgres; sleep 2; done"]
        - name: wait-nats
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until wget -q -O- http://nats:8222/healthz >/dev/null 2>&1; do echo waiting nats; sleep 2; done"]
      containers:
        - name: besa
          image: besa-agent:v4
          imagePullPolicy: IfNotPresent
          args: ["--env", "prod", "serve", "--role", "control"]
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: besa-config}
            - secretRef: {name: besa-secrets}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
