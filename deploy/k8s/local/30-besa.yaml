    matchLabels: {app: besa-orchestrator}
  template:
    metadata:
      labels: {app: besa-orchestrator}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true}
