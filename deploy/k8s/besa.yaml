apiVersion: v1
kind: Namespace
metadata:
  name: besa
---
apiVersion: v1
kind: Secret
metadata:
  name: besa-secrets
  namespace: besa
type: Opaque
stringData:
  # 只放示例键名；生产用外部 Secret 管理（SealedSecret / External Secrets）
  BESA_POSTGRES_DSN: postgresql://besa:besa@postgres.besa.svc:5432/besa_agent
  BESA_REDIS_URL: redis://redis.besa.svc:6379/0
  BESA_NATS_URL: nats://nats.besa.svc:4222
  BESA_S3_ENDPOINT: minio.besa.svc:9000
  MINIO_ACCESS_KEY: besa
  MINIO_SECRET_KEY: change-me
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: ""
  DASHSCOPE_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: besa-config
  namespace: besa
data:
  BESA_ENV: "prod"
  BESA_LOG_LEVEL: "INFO"
  BESA_WORKDIR: "/workspace"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: besa-gateway, namespace: besa}
spec:
  replicas: 2
  selector: {matchLabels: {app: besa-gateway}}
  template:
    metadata: {labels: {app: besa-gateway}}
    spec:
      containers:
        - name: besa
          image: besa-agent:local
          args: ["--env", "prod", "serve", "--role", "gateway"]
          ports: [{containerPort: 9001}]
          envFrom: [{configMapRef: {name: besa-config}}, {secretRef: {name: besa-secrets}}]
          readinessProbe: {tcpSocket: {port: 9001}, initialDelaySeconds: 3}
          livenessProbe: {tcpSocket: {port: 9001}, initialDelaySeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: besa-gateway, namespace: besa}
spec:
  selector: {app: besa-gateway}
  ports: [{port: 9001, targetPort: 9001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: besa-tool, namespace: besa}
spec:
  replicas: 2
  selector: {matchLabels: {app: besa-tool}}
  template:
    metadata: {labels: {app: besa-tool}}
    spec:
      containers:
        - name: besa
          image: besa-agent:local
          args: ["--env", "prod", "serve", "--role", "tool"]
          ports: [{containerPort: 9002}]
          envFrom: [{configMapRef: {name: besa-config}}, {secretRef: {name: besa-secrets}}]
          volumeMounts: [{name: workspace, mountPath: /workspace}]
          readinessProbe: {tcpSocket: {port: 9002}, initialDelaySeconds: 3}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
      volumes:
        - name: workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: besa-tool, namespace: besa}
spec:
  selector: {app: besa-tool}
  ports: [{port: 9002, targetPort: 9002}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: besa-memory, namespace: besa}
spec:
  replicas: 1
  selector: {matchLabels: {app: besa-memory}}
  template:
    metadata: {labels: {app: besa-memory}}
    spec:
      containers:
        - name: besa
          image: besa-agent:local
          args: ["--env", "prod", "serve", "--role", "memory"]
          ports: [{containerPort: 9004}]
          envFrom: [{configMapRef: {name: besa-config}}, {secretRef: {name: besa-secrets}}]
          readinessProbe: {tcpSocket: {port: 9004}, initialDelaySeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: besa-memory, namespace: besa}
spec:
  selector: {app: besa-memory}
  ports: [{port: 9004, targetPort: 9004}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: besa-strategy, namespace: besa}
spec:
  replicas: 1
  selector: {matchLabels: {app: besa-strategy}}
  template:
    metadata: {labels: {app: besa-strategy}}
    spec:
      containers:
        - name: besa
          image: besa-agent:local
          args: ["--env", "prod", "serve", "--role", "strategy"]
          ports: [{containerPort: 9005}]
          envFrom: [{configMapRef: {name: besa-config}}, {secretRef: {name: besa-secrets}}]
---
apiVersion: v1
kind: Service
metadata: {name: besa-strategy, namespace: besa}
spec:
  selector: {app: besa-strategy}
  ports: [{port: 9005, targetPort: 9005}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: besa-experience, namespace: besa}
spec:
  replicas: 1
  selector: {matchLabels: {app: besa-experience}}
  template:
    metadata: {labels: {app: besa-experience}}
    spec:
      containers:
        - name: besa
          image: besa-agent:local
          args: ["--env", "prod", "serve", "--role", "experience"]
          ports: [{containerPort: 9006}]
          envFrom: [{configMapRef: {name: besa-config}}, {secretRef: {name: besa-secrets}}]
---
apiVersion: v1
kind: Service
metadata: {name: besa-experience, namespace: besa}
spec:
  selector: {app: besa-experience}
  ports: [{port: 9006, targetPort: 9006}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: besa-agent, namespace: besa}
spec:
  replicas: 3
  selector: {matchLabels: {app: besa-agent}}
  template:
    metadata: {labels: {app: besa-agent}}
    spec:
      containers:
        - name: besa
          image: besa-agent:local
          args: ["--env", "prod", "serve", "--role", "agent"]
          ports: [{containerPort: 9003}]
          envFrom: [{configMapRef: {name: besa-config}}, {secretRef: {name: besa-secrets}}]
          readinessProbe: {tcpSocket: {port: 9003}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: besa-agent, namespace: besa}
spec:
  selector: {app: besa-agent}
  ports: [{port: 9003, targetPort: 9003}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: besa-agent, namespace: besa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: besa-agent}
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: besa-orchestrator, namespace: besa}
spec:
  # ⚠ 同一工作流运行应单调度器；需要多副本时先实现跨副本资源租约
  replicas: 1
  selector: {matchLabels: {app: besa-orchestrator}}
  template:
    metadata: {labels: {app: besa-orchestrator}}
    spec:
      containers:
        - name: besa
          image: besa-agent:local
          args: ["--env", "prod", "serve", "--role", "orchestrator"]
          ports: [{containerPort: 9007}, {containerPort: 9008}]
          envFrom: [{configMapRef: {name: besa-config}}, {secretRef: {name: besa-secrets}}]
---
apiVersion: v1
kind: Service
metadata: {name: besa-orchestrator, namespace: besa}
spec:
  selector: {app: besa-orchestrator}
  ports:
    - {name: orchestrator, port: 9007, targetPort: 9007}
    - {name: workflow, port: 9008, targetPort: 9008}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: besa-control, namespace: besa}
spec:
  replicas: 2
  selector: {matchLabels: {app: besa-control}}
  template:
    metadata: {labels: {app: besa-control}}
    spec:
      containers:
        - name: besa
          image: besa-agent:local
          args: ["--env", "prod", "serve", "--role", "control"]
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: besa-config}}, {secretRef: {name: besa-secrets}}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: besa-control, namespace: besa}
spec:
  selector: {app: besa-control}
  ports: [{port: 8080, targetPort: 8080}]
